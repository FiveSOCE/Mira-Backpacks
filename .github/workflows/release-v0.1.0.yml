name: Release v0.1.0
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: db094de889429295057f47d1fe9754855eaebb51
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: MiraBackpacks v0.1.0
          target_commitish: db094de889429295057f47d1fe9754855eaebb51
          body: Initial MiraBackpacks release with persistent personal storage, permission-based size tiers, admin inspection and public API.
          files: build/libs/MiraBackpacks-0.1.0.jar
