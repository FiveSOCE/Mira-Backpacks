name: Build MiraBackpacks Paper 1.18.2
on:
  push:
    branches: ['compat/1.18.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile Java 17 / Paper 1.18.2
        run: gradle clean build --no-daemon --stacktrace
      - name: Validate legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/MiraBackpacks_1.18.2.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx plugin.yml
          jar tf "$JAR" | grep -Fx gg/mira/backpacks/MiraBackpacksPlugin.class
          javap -verbose -classpath "$JAR" gg.mira.backpacks.MiraBackpacksPlugin | grep -F 'major version: 61'
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '1.18'"
      - uses: actions/upload-artifact@v4
        with:
          name: MiraBackpacks_1.18.2
          path: build/libs/MiraBackpacks_1.18.2.jar
          if-no-files-found: error
      - name: Publish legacy prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-1.18.2 >/dev/null 2>&1 || gh release create dev-1.18.2 --prerelease --title 'MiraBackpacks Paper 1.18.2' --notes 'Java 17 legacy build with MiraCore legacy API. Requires MiraCore. MiraEnchantments integration should be verified in game.' --target "$GITHUB_SHA"
          gh release upload dev-1.18.2 build/libs/MiraBackpacks_1.18.2.jar --clobber
