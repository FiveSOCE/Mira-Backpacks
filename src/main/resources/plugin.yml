name: MiraBackpacks
version: ${version}
main: gg.mira.backpacks.MiraBackpacksPlugin
api-version: '1.21'
author: FiveSOCE
description: Chestplate-linked persistent backpack storage for the Mira ecosystem.
depend: [MiraCore]
commands:
  backpack:
    aliases: [bp]
    description: Open or administer the Backpack enchant storage
    usage: /backpack [inspect|edit|status|recover]
    permission: mirabackpacks.use
permissions:
  mirabackpacks.use: {default: true}
  mirabackpacks.admin.inspect: {default: op}
  mirabackpacks.admin.edit: {default: op}
  mirabackpacks.admin.recover: {default: op}
