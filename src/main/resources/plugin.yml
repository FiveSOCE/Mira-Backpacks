name: MiraBackpacks
version: ${version}
main: gg.mira.backpacks.MiraBackpacksPlugin
api-version: '1.21'
author: FiveSOCE
description: Unique physical backpack items with persistent UUID storage for the Mira ecosystem.
depend: [MiraCore]
commands:
  backpack:
    aliases: [bp]
    description: Open or administer physical Mira backpacks
    usage: /backpack [give|inspect|edit|status|recover|reload]
    permission: mirabackpacks.use
permissions:
  mirabackpacks.use: {default: true}
  mirabackpacks.admin: {default: op}
  mirabackpacks.admin.inspect: {default: op}
  mirabackpacks.admin.edit: {default: op}
  mirabackpacks.admin.recover: {default: op}
